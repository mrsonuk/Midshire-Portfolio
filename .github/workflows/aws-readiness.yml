name: MUH AWS public-demo readiness

on:
  push:
    branches:
      - deploy/aws-midshire-public
  pull_request:
    paths:
      - "uec_hybrid/**"
      - "requirements.txt"
      - "Dockerfile"
      - ".github/workflows/aws-readiness.yml"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile source
        run: python -m compileall -q uec_hybrid
      - name: Public visitor-isolation and security regression
        run: python -m uec_hybrid.tests.public
      - name: Existing Cambridge and Midshire model tests
        run: python -m uec_hybrid.tests.run
      - name: Build AWS Docker container
        run: docker build --tag midshire-aws:ci .
